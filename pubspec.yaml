name: why_did_i_unlock
description: "A digital-wellbeing app that asks what you're unlocking your phone for, then keeps a persistent bubble reminder until you're done."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.6.4+17

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Forked from X-SLAYER/flutter_overlay_window (upstream ^0.5.0 — no newer
  # official release exists) to patch a real native crash: OverlayService.
  # onStartCommand dereferenced a null Intent, which Android delivers on every
  # restart of a low-memory-killed START_STICKY service — hit 3 closed testers
  # (Android vitals, 2026-08-02). Fix + upstream issue status, and the plan for
  # dropping this fork if/when upstream merges a fix:
  # docs/debug/rca-overlay-service-null-intent-crash-2026-08-02.md
  flutter_overlay_window:
    git:
      url: https://github.com/diniiidinesh/flutter_overlay_window.git
      ref: fix/overlay-service-null-intent
  shared_preferences: ^2.3.2
  sqflite: ^2.4.3
  path: ^1.9.1
  # About screen (Sprint 4, T5): mailto feedback + placeholder privacy-policy/Play
  # links. No new permission or network dependency on its own — url_launcher just
  # hands the URI to the OS (an email app / browser), matching the local-first
  # stance (CLAUDE.md SS11) since the app itself still makes no network calls.
  url_launcher: ^6.3.1
  # Status screen: one-tap "ignore battery optimizations" system dialog
  # (Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS under the hood) —
  # standard on every OEM, unlike the manufacturer-specific Autostart Manager
  # screens (Vivo/Xiaomi/Oppo), which have no public API and stay
  # instructions-only (oem_autostart_copy.dart). Requires the
  # REQUEST_IGNORE_BATTERY_OPTIMIZATIONS manifest permission (added
  # alongside), which Play scrutinizes — see docs/PLAY_SUBMISSION.md.
  permission_handler: ^11.3.1
  # Settings CSV export (T17): system share sheet. Scoped storage makes a
  # plain Downloads write non-trivial — share_plus hands the temp file to
  # the OS share sheet instead (docs/erd/sprint4-app-shell-plan §9,
  # docs/DATA_MODEL.md §9). No network call by the app itself.
  share_plus: ^10.1.4
  # OEM guidance highlight (Status / onboarding): reads Build.MANUFACTURER
  # without custom Kotlin. See lib/device_manufacturer.dart + oem_autostart_copy.
  device_info_plus: ^11.2.0
  # Day-1 recap reminder (onboarding revamp PR 4). Local only — posted
  # from the background engine on an existing unlock, never zonedSchedule /
  # FCM. Overlay isolate must not call this plugin.
  flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4
  sqflite_common_ffi: ^2.4.2
  shared_preferences_platform_interface: ^2.4.2

# Launcher icon — Beacon mark on navy (solid). Do not use assets/branding/mark.png:
# that file has a baked-in checkerboard (fake transparency).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true

# Native splash — full lockup on pre-12; Android 12+ uses a *square* icon only
# (the system draws it in a circular mask — a portrait splash gets stretched).
flutter_native_splash:
  color: "#0B1220"
  image: assets/branding/splash.png
  android: true
  ios: true
  android_12:
    color: "#0B1220"
    icon_background_color: "#0B1220"
    image: assets/icon/icon.png
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/branding/mark.png
    - assets/branding/splash.png
    - assets/icon/icon.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
